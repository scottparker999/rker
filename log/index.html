<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Lift Log</title>
<link rel="preload" href="/log/fonts/barlow-condensed-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/log/app.css">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<script src="/log/app.js" defer></script>
</head>
<body>
<header>
  <div class="wrap">
    <div class="head"><h1>Lift Log</h1><span class="status" id="status">Connecting…</span></div>
    <nav role="tablist">
      <button role="tab" id="tab-log" data-tab="log" aria-selected="true">Train</button>
      <button role="tab" id="tab-progress" data-tab="progress" aria-selected="false">Progress</button>
      <button role="tab" id="tab-body" data-tab="body" aria-selected="false">Body</button>
    </nav>
  </div>
</header>
<main class="wrap" id="main"></main>
<div class="timer" id="timer" hidden>
  <div class="bar" id="timer-bar"></div>
  <div class="in">
    <div class="t" id="timer-t">1:30</div>
    <div class="lbl" id="timer-lbl">Rest</div>
    <button type="button" id="timer-add">+15s</button>
    <button type="button" id="timer-skip">Done</button>
  </div>
</div>
</body>
</html>
