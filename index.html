<!-- ---------- Fonts (self-hosted, see /fonts.css) ---------- -->
<link rel="stylesheet" href="/fonts.css">

<style>
  :root {
    color-scheme: light dark;
    --paper:  #FBFAF7;
    --ink:    #1A1A1A;
    --muted:  #6B6B6B;
    --line:   #E7E4DD;
    --accent: #4B3BFF;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper:  #131210;
      --ink:    #ECEAE3;
      --muted:  #8A8781;
      --line:   #2A2824;
      --accent: #8674FF;
    }
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: "Space Grotesk", system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100dvh;
    padding: 2rem 1.5rem;
    text-align: center;
    -webkit-font-smoothing: antialiased;
  }

  .flags {
    display: flex;
    justify-content: center;
    gap: 0.6rem;
    margin-bottom: 1.9rem;
    opacity: 0;
    animation: rise 0.7s ease-out 0.05s forwards;
  }
  .flags img {
    width: 32px;
    height: 24px;
    border-radius: 3px;
    box-shadow: 0 0 0 1px rgba(0,0,0,0.08);
    display: block;
  }
  @media (prefers-color-scheme: dark) {
    .flags img { box-shadow: 0 0 0 1px rgba(255,255,255,0.14); }
  }
  /* The flags are the easter egg: quietly clickable, never shouty. */
  .flag {
    background: none;
    border: 0;
    padding: 0;
    line-height: 0;
    border-radius: 3px;
    cursor: pointer;
    transition: transform 0.2s ease;
  }
  .flag:hover { transform: translateY(-2px); }
  .flag:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
  .flag[aria-pressed="true"] img { box-shadow: 0 0 0 2px var(--accent); }
  /* A ring alone is hard to see against the flags' own colours, so the
     one that is not chosen steps back. Only once a choice is made. */
  .flags[data-active] .flag[aria-pressed="false"] { opacity: 0.4; }
  .flag { transition: transform 0.2s ease, opacity 0.2s ease; }

  /* Fade the copy as it swaps. Filter rather than opacity, because the
     entrance animation fills forwards and would win over an opacity rule. */
  .hint, .tagline { transition: filter 0.18s ease; }
  .swapping { filter: opacity(0.25); }

  h1.name {
    display: flex;
    justify-content: center;
    font-weight: 700;
    line-height: 0.9;
  }

  .wordmark {
    font-family: inherit;
    font-weight: 700;
    font-size: clamp(3.75rem, 18vw, 11rem);
    line-height: 0.9;
    letter-spacing: -0.03em;
    background: none;
    border: 0;
    color: inherit;
    cursor: pointer;
    padding: 0.1em 0.15em;
    border-radius: 0.15em;
    opacity: 0;
    animation: rise 0.8s ease-out 0.25s forwards;
  }
  .wordmark:focus-visible {
    outline: 3px solid var(--accent);
    outline-offset: 0.1em;
  }

  .at {
    color: var(--accent);
    display: inline-block;
    transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    transform-origin: 55% 55%;
    animation: settle 0.9s cubic-bezier(0.34, 1.56, 0.64, 1) 0.55s backwards;
  }
  .wordmark:hover .at,
  .wordmark:focus-visible .at { transform: rotate(360deg); }

  .hint {
    font-family: "Space Mono", monospace;
    font-size: 0.75rem;
    color: var(--muted);
    margin-top: 0.6rem;
    min-height: 1.2em;
    opacity: 0;
    animation: rise 0.7s ease-out 0.45s forwards;
    transition: color 0.2s ease;
  }
  .hint.copied { color: var(--accent); }

  .tagline {
    max-width: 42ch;
    margin-inline: auto;
    font-size: clamp(1rem, 3.5vw, 1.2rem);
    color: var(--muted);
    margin-top: 1.75rem;
    line-height: 1.5;
    opacity: 0;
    animation: rise 0.8s ease-out 0.55s forwards;
  }

  .links {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 0.4rem 1.4rem;
    margin-top: 2.25rem;
    font-family: "Space Mono", monospace;
    font-size: 0.85rem;
    opacity: 0;
    animation: rise 0.8s ease-out 0.7s forwards;
  }
  .links a {
    color: var(--ink);
    text-decoration: none;
    position: relative;
    padding-bottom: 2px;
  }
  .links a::after {
    content: "";
    position: absolute;
    left: 0; bottom: 0;
    width: 100%; height: 1.5px;
    background: var(--accent);
    transform: scaleX(0);
    transform-origin: left;
    transition: transform 0.25s ease;
  }
  .links a:hover::after,
  .links a:focus-visible::after { transform: scaleX(1); }
  .links a:focus-visible { outline: none; color: var(--accent); }

  footer {
    position: fixed;
    bottom: 1.5rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.7rem;
    font-family: "Space Mono", monospace;
    font-size: 0.72rem;
    letter-spacing: 0.1em;
    color: var(--muted);
    opacity: 0;
    animation: rise 0.8s ease-out 0.9s forwards;
  }
  footer .at-small { color: var(--accent); }

  .pages {
    display: flex;
    gap: 1.3rem;
    font-size: 0.8rem;
    letter-spacing: 0.02em;
  }
  .pages a {
    color: var(--ink);
    text-decoration: none;
    position: relative;
    padding-bottom: 2px;
  }
  .pages a::after {
    content: "";
    position: absolute;
    left: 0; bottom: 0;
    width: 100%; height: 1.5px;
    background: var(--accent);
    transform: scaleX(0);
    transform-origin: left;
    transition: transform 0.25s ease;
  }
  .pages a:hover::after,
  .pages a:focus-visible::after { transform: scaleX(1); }
  .pages a:focus-visible { outline: none; color: var(--accent); }

  /* Keep the fixed footer from colliding with content on short screens */
  body { padding-bottom: 6rem; }
  @media (max-height: 600px) {
    footer { position: static; margin-top: 2.5rem; }
    body { padding-bottom: 2rem; }
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes settle {
    0%   { transform: rotate(-190deg) scale(0.4); }
    100% { transform: rotate(0deg) scale(1); }
  }

  @media (prefers-reduced-motion: reduce) {
    *, .at { animation: none !important; transition: none !important; }
    .flags, .wordmark, .hint, .tagline, .links, footer { opacity: 1; transform: none; }
  }
</style>
</head>
<body>
  <main>
    <!-- Dual citizenship as the eyebrow. Click one and the wording follows it home;
         click it again to come back to neutral. -->
    <div class="flags">
      <button class="flag" type="button" data-voice="gb" aria-pressed="false"
              aria-label="United Kingdom — put the wording back in Lancashire">
        <img src="/gb.svg" width="32" height="24" alt="" loading="lazy" decoding="async">
      </button>
      <button class="flag" type="button" data-voice="au" aria-pressed="false"
              aria-label="Australia — put the wording in Australian">
        <img src="/au.svg" width="32" height="24" alt="" loading="lazy" decoding="async">
      </button>
    </div>

    <!-- The name is the page's h1; the button inside copies your email on click. -->
    <h1 class="name">
      <button class="wordmark" id="mark" aria-label="Copy email address p@rker.me">P<span class="at">@</span>rker</button>
    </h1>

    <!-- Live region: screen readers announce the "copied" confirmation. -->
    <p class="hint" id="hint" role="status" aria-live="polite">click my name to copy the email</p>

    <!-- EDIT ME: your one-liner -->
    <p class="tagline" id="tagline">Gold Coast–based, with twenty years in hospitality and tourism. Full-stack systems specialist — PMS, RMS, BI, POS, web and the integrations that tie them together.</p>

    <!-- EDIT ME: your links. Delete any you don't want. -->
    <nav class="links" aria-label="Elsewhere">
      <a href="mailto:p@rker.me">email</a>
      <a href="https://www.linkedin.com/in/scott-p-7385b52a/" target="_blank" rel="noopener me">linkedin</a>
    </nav>
  </main>

  <footer>
    <nav class="pages" aria-label="Pages">
      <a href="/cv">cv</a>
      <a href="/writing/">writing</a>
      <a href="/tools/">tools</a>
      <a href="/colophon">colophon</a>
    </nav>
    <span class="mark-line">p<span class="at-small">@</span>rker.me</span>
  </footer>

<script>
  const EMAIL = "p@rker.me";   // EDIT ME if your address differs
  const mark = document.getElementById("mark");
  const hint = document.getElementById("hint");
  const tagline = document.getElementById("tagline");

  /* EDIT ME: the flags are an easter egg. Click one and the page rewords
     itself in that accent; click it again for plain English. Kept light on
     purpose — a couple of word choices, no phonetic spelling. */
  const VOICES = {
    neutral: {
      lang: "en",
      hint: "click my name to copy the email",
      copied: "copied  \u00b7  ",
      tagline: "Gold Coast\u2013based, with twenty years in hospitality and tourism. "
        + "Full-stack systems specialist \u2014 PMS, RMS, BI, POS, web and the integrations "
        + "that tie them together.",
    },
    gb: {
      lang: "en-GB",
      hint: "give my name a click for the email",
      copied: "there y'are  \u00b7  ",
      tagline: "Blackburn born, Gold Coast these days. Twenty years in hospitality and "
        + "tourism \u2014 PMS, RMS, BI, POS, web, and getting the lot to talk to each other. "
        + "Nowt clever about it, it just works.",
    },
    au: {
      lang: "en-AU",
      hint: "click my name, that'll grab the email",
      copied: "too easy  \u00b7  ",
      tagline: "Gold Coast based, Blackburn originally. Twenty years in hospitality and "
        + "tourism \u2014 PMS, RMS, BI, POS, web, and making the whole lot talk to each other. "
        + "Reckon I can sort most of it.",
    },
  };

  let voice = "neutral";
  let resetTimer, swapTimer;

  document.querySelectorAll(".flag").forEach((button) => {
    button.addEventListener("click", () => {
      // Clicking the flag that is already on takes you back to plain English.
      voice = voice === button.dataset.voice ? "neutral" : button.dataset.voice;
      const v = VOICES[voice];

      const flags = document.querySelector(".flags");
      document.querySelectorAll(".flag").forEach((b) => {
        b.setAttribute("aria-pressed", String(b.dataset.voice === voice));
      });
      if (voice === "neutral") flags.removeAttribute("data-active");
      else flags.setAttribute("data-active", voice);
      document.documentElement.lang = v.lang;

      clearTimeout(resetTimer);
      clearTimeout(swapTimer);
      hint.classList.add("swapping");
      tagline.classList.add("swapping");
      swapTimer = setTimeout(() => {
        hint.textContent = v.hint;
        tagline.textContent = v.tagline;
        hint.classList.remove("copied", "swapping");
        tagline.classList.remove("swapping");
      }, 170);
    });
  });

  mark.addEventListener("click", async () => {
    const v = VOICES[voice];
    try {
      await navigator.clipboard.writeText(EMAIL);
      hint.textContent = v.copied + EMAIL;
    } catch {
      hint.textContent = EMAIL;   // clipboard blocked \u2014 show it so it can be copied manually
    }
    hint.classList.add("copied");
    clearTimeout(resetTimer);
    resetTimer = setTimeout(() => {
      hint.textContent = v.hint;   // back to whichever voice is on
      hint.classList.remove("copied");
    }, 2600);
  });
</script>
</body>
